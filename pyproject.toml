[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "props-bench"
version = "1.0.0"
description = "PROPS benchmark: loading, generation, scoring and leaderboard."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy",
    "pillow",
    "huggingface_hub>=0.25",
    "openai>=1.40",
]

[project.optional-dependencies]
ego = ["av>=12", "opencv-python-headless>=4.8"]
qwen = ["torch", "diffusers>=0.36", "transformers", "accelerate"]

[project.scripts]
props = "props.cli:main"

[tool.setuptools.packages.find]
include = ["props*"]
